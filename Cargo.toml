[package]
name = "sn46-validator"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"

[workspace]
members = ["subtensor"]
exclude = ["fuzz"]

[dependencies]
sn46-shared = { git = "https://github.com/Subnet46/sn46-shared", rev = "2587d615219cfa825cfc7c7fa9b585c7056864ba" }
ark-serialize = "0.4.2"
clap = { version = "4.6.6", features = ["derive", "env"] }
hex = "0.4.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
sha2 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
subtensor = { path = "subtensor" }
subxt = { version = "0.50.3", default-features = false, features = ["jsonrpsee", "native"] }
subxt-signer = { version = "0.50.3", default-features = false, features = ["sr25519", "std", "subxt"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "time", "sync", "signal"] }
# Same timelock engine and BLS version as Subtensor and bittensor-drand.
tle = { git = "https://github.com/ideal-lab5/timelock", rev = "5416406cfd32799e31e1795393d4916894de4468" }
w3f-bls = "=0.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.4.1"

[dev-dependencies]
futures-util = "0.3.34"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
